name: build-3dsx

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITARM=$DEVKITARM"
          ls "$DEVKITPRO/libctru/lib" | head -20

      - name: Build
        run: make -j"$(nproc)"

      - name: Upload 3dsx
        uses: actions/upload-artifact@v4
        with:
          name: stereodemo-3dsx
          path: stereodemo.3dsx
          if-no-files-found: error
