name: build-3dsx

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITARM=$DEVKITARM"
          which make arm-none-eabi-gcc || true
          ls "$DEVKITPRO/libctru/lib" | head -20

      - name: Probe API
        shell: bash
        run: |
          pacman -Q libctru citro3d 2>/dev/null | tr '\n' ';' | sed 's/^/::notice::vers: /'
          grep -n "C3D_RenderTargetCreate(" "$DEVKITPRO/libctru/include/c3d/renderqueue.h" | head -2 | sed 's/^/::notice::rt: /'
          grep -n "osGet3DSliderState" "$DEVKITPRO/libctru/include/3ds/os.h" | head -2 | sed 's/^/::notice::slider: /'

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          if ! make -j"$(nproc)" > build.log 2>&1; then
            tail -8 build.log | while IFS= read -r l; do
              echo "::error title=build::$l"
            done
            exit 1
          fi
          tail -5 build.log

      - name: Upload 3dsx
        uses: actions/upload-artifact@v4
        with:
          name: stereodemo-3dsx
          path: stereodemo.3dsx
          if-no-files-found: error
